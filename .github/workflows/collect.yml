name: Collect Energy-AI News (Eastern)

on:
  workflow_dispatch:
    inputs:
      force_run:
        description: "Run now (ignore the 6am/6pm Eastern gate)"
        required: false
        default: "false"
  schedule:
    # GitHub cron is UTC; we run hourly and gate on America/New_York in code (handles DST automatically)
    - cron: "5 * * * *"

permissions:
  contents: write

concurrency:
  group: energy-ai-collector
  cancel-in-progress: true

jobs:
  collect:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Decide whether to run now (America/New_York)
        id: gate
        run: |
          python - <<'PY'
          from datetime import datetime
          from zoneinfo import ZoneInfo
          import os

          force = (os.environ.get("FORCE_RUN", "false").lower() == "true")
          now = datetime.now(ZoneInfo("America/New_York"))

          # Run at 06:xx and 18:xx New York time
          run_now = force or (now.hour in (6, 18))

          print("Eastern time now:", now.isoformat())
          print("force_run:", force)
          print("run_now:", run_now)

          with open(os.environ["GITHUB_OUTPUT"], "a") as f:
              f.write(f"run_now={'true' if run_now else 'false'}\n")
          PY
        env:
          FORCE_RUN: ${{ github.event.inputs.force_run }}

      - name: Run collector
        if: steps.gate.outputs.run_now == 'true'
        run: |
          python mini_prototype.py

      - name: Commit & push results (docs/data)
        if: steps.gate.outputs.run_now == 'true'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

          git add docs/data || true

          if git diff --cached --quiet; then
            echo "No changes to commit."
            exit 0
          fi

          git commit -m "Update collected articles"
          git push
