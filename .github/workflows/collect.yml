name: Collect Energy-AI News (EST)

on:
  workflow_dispatch: {}
  schedule:
    # GitHub cron uses UTC
    # 06:00 EST (UTC-5) = 11:00 UTC
    - cron: "0 11 * * *"
    # 18:00 EST (UTC-5) = 23:00 UTC
    - cron: "0 23 * * *"

permissions:
  contents: write

concurrency:
  group: energy-ai-collector
  cancel-in-progress: true

jobs:
  collect:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run collector
        run: |
          python mini_prototype.py

      - name: Commit & push results
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data/latest.csv || true
          git add data/articles_*.csv || true
          git commit -m "Auto-collect $(date -u +'%Y-%m-%d %H:%M UTC')" || echo "No changes to commit"
          git push
